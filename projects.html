<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emma Ludwig | Projects</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg site-nav sticky-top">
    <div class="container">
      <a class="navbar-brand" href="index.html">Emma Ludwig</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
              aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto align-items-lg-center">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="skills.html">Skills</a></li>
          <li class="nav-item"><a class="nav-link" href="experience.html">Experience</a></li>
          <li class="nav-item"><a class="nav-link active" aria-current="page" href="projects.html">Projects</a></li>
          <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
          <li class="nav-item ms-lg-2">
            <button id="themeToggle" class="btn btn-theme" type="button" aria-label="Toggle dark mode">
              <i class="bi bi-moon-stars"></i>
            </button>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <header class="page-header">
    <div class="container">
      <p class="eyebrow">What I've built</p>
      <h1>Projects</h1>
      <p class="lead mb-0">Coursework, client work, and research. Filter by category, search by keyword, or open a card for details.</p>
    </div>
  </header>

  <section class="section">
    <div class="container">
      <div class="row g-3 align-items-center mb-4">
        <div class="col-lg-8">
          <!-- Filter buttons are generated from the categories in projects.json -->
          <div id="filterButtons" class="filter-group" role="group" aria-label="Filter projects by category"></div>
        </div>
        <div class="col-lg-4">
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-search"></i></span>
            <input type="search" id="projectSearch" class="form-control" placeholder="Search projects..." aria-label="Search projects">
          </div>
        </div>
      </div>

      <p id="resultCount" class="result-count"></p>

      <!-- Project cards are inserted here by script.js -->
      <div id="projectGrid" class="row g-4"></div>
    </div>
  </section>

  <!-- Project details modal (filled in by JavaScript) -->
  <div class="modal fade" id="projectModal" tabindex="-1" aria-labelledby="projectModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title h5" id="projectModalTitle"></h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="projectModalBody"></div>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <div class="container d-flex flex-column flex-md-row justify-content-between gap-2">
      <span>&copy; <span class="year"></span> Emma Ludwig</span>
      <span>Built with HTML, CSS, JavaScript &amp; Bootstrap</span>
    </div>
  </footer>

  <button id="backToTop" class="back-to-top" aria-label="Back to top"><i class="bi bi-arrow-up"></i></button>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
